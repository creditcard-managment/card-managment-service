# Kafka Configuration for Payment Processing
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      acks: all
      retries: 3
      compression-type: snappy
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    topics:
      partitions: ${KAFKA_TOPIC_PARTITIONS:3}
      # Tiene que ser <= cantidad de brokers (docker-compose tiene uno solo: KAFKA_TOPIC_REPLICATION_FACTOR=1)
      replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:2}

      payment:
        initiated: payment.processing.initiated
        authorized: payment.processing.authorized
        processed: payment.processing.completed
        declined: payment.processing.declined
        reversed: payment.reversal.completed
        default: payment.events

      refund:
        initiated: payment.refund.initiated
        processed: payment.refund.processed

      transaction:
        settled: payment.settlement.completed
        completed: payment.transaction.completed

      fraud:
        detected: payment.fraud.detected

# Logging
logging:
  level:
    com.unisono.card.payment.infrastructure.adapter.output.event: DEBUG
    org.apache.kafka: INFO
