spring:
  application:
    name: card-data
  
  datasource:
    url: jdbc:postgresql://localhost:5432/card_management_db
    username: card_user
    password: card_pass
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CardManagementHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
        spring.json.add.type.headers: false
    properties:
      spring.json.trusted.packages: "com.unisono.card.events.domain"

server:
  port: 8081

encryption:
  # Clave con la que se cifra. Para rotar: agregar una clave nueva y apuntar active-key-id a ella
  # (las anteriores se mantienen para descifrar lo ya guardado)
  active-key-id: "${ENCRYPTION_ACTIVE_KEY_ID:k1}"
  keys:
    # Base64 de 32 bytes aleatorios: openssl rand -base64 32. ⚠️ Definirla en producción
    k1: "${ENCRYPTION_KEY_K1:XoWxm5k3kGPnaReCddiTBqRf+BH5OiJuVz0AxweCRDU=}"
  # Solo para descifrar datos guardados antes del llavero (sin prefijo "k1:"); se re-cifran con
  # la clave activa al volver a guardarse
  legacy-secret-key: "${ENCRYPTION_KEY:MySecretKey32BytesForAES256!!123}"

# Claves de cifrado de PIN (PEK) que comparte con los terminales: descifra los PIN blocks ISO 9564
# formato 4 de validate-pin. El terminal envía el id de la clave (pinKeyId) con el bloque
pin-encryption:
  keys:
    # Base64 de 16 bytes (AES-128): openssl rand -base64 16. ⚠️ Definirla en producción (idealmente en un HSM)
    pek-v1: "${PIN_ENCRYPTION_KEY_V1:+ep2jpFqFwl6KCzkw+qerg==}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics  # Exponer endpoints específicos
        # O exponer todos: include: "*"
  endpoint:
    health:
      show-details: always  # Mostrar detalles del health check

logging:
  level:
    com.unisono.card: DEBUG
    # SQL de Hibernate apagado: el OutboxRelay consulta cada segundo y BasicBinder (TRACE)
    # loguearía los valores de los parámetros (datos del titular, PAN/CVV cifrados, hash del PIN).
    # Para depurar: LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG
    org.hibernate.SQL: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: INFO