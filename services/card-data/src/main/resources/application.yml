spring:
  application:
    name: card-data
  
  datasource:
    url: jdbc:postgresql://localhost:5432/card_management_db
    username: card_user
    password: card_pass
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CardManagementHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 5
        enable.idempotence: true
        spring.json.add.type.headers: false
    properties:
      spring.json.trusted.packages: "com.unisono.card.events.domain"

server:
  port: 8081

encryption:
  # Variable ENCRYPTION_KEY (docker-compose). ⚠️ Definirla en producción: exactamente 32 caracteres
  secret-key: "${ENCRYPTION_KEY:MySecretKey32BytesForAES256!!123}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics  # Exponer endpoints específicos
        # O exponer todos: include: "*"
  endpoint:
    health:
      show-details: always  # Mostrar detalles del health check

logging:
  level:
    com.unisono.card: DEBUG
    # SQL de Hibernate apagado: el OutboxRelay consulta cada segundo y BasicBinder (TRACE)
    # loguearía los valores de los parámetros (datos del titular, PAN/CVV cifrados, hash del PIN).
    # Para depurar: LOGGING_LEVEL_ORG_HIBERNATE_SQL=DEBUG
    org.hibernate.SQL: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: INFO