# =============================================
# Card Data Module Configuration
# Module: card-data
# =============================================

spring:
  application:
    name: card-data-service

  # =============================================
  # Database Configuration
  # =============================================
  datasource:
    url: jdbc:postgresql://localhost:5432/card_management_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

    # HikariCP Configuration
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000      # 30 seconds
      idle-timeout: 600000           # 10 minutes
      max-lifetime: 1800000          # 30 minutes
      auto-commit: true
      pool-name: CardManagementHikariCP

  # =============================================
  # JPA/Hibernate Configuration
  # =============================================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        # Second-level cache (opcional)
        cache:
          use_second_level_cache: false
          use_query_cache: false
        # Statistics (solo para desarrollo)
        generate_statistics: false

  # =============================================
  # Flyway Configuration
  # =============================================
  flyway:
    enabled: false

# =============================================
# Server Configuration
# =============================================
server:
  port: 8081
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param  # Solo en dev
    include-exception: false

# =============================================
# Logging Configuration
# =============================================
logging:
  level:
    root: INFO
    com.unisono.card.data: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc.core: DEBUG
    com.zaxxer.hikari: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/card-data.log
    max-size: 10MB
    max-history: 30

# =============================================
# Actuator Configuration (para health checks)
# =============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# =============================================
# SpringDoc OpenAPI Configuration
# =============================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: true

# =============================================
# Custom Application Properties
# =============================================
card:
  data:
    # Configuraciones específicas del módulo
    encryption:
      algorithm: AES-256-GCM
    audit:
      enabled: true
    validation:
      strict-mode: true
    # Outbox: publicación de eventos a Kafka (OutboxRelay)
    outbox:
      poll-interval-ms: 1000     # Frecuencia de lectura de eventos pendientes
      batch-size: 50             # Eventos por pasada
      send-timeout-ms: 15000     # Espera por evento; debe superar delivery.timeout.ms + max.block.ms del productor
      retention-days: 7          # Días que se conservan los eventos publicados
      cleanup-cron: "0 0 3 * * *" # Limpieza diaria (los eventos fallidos no se borran)
