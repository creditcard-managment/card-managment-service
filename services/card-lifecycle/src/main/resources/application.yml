spring:
  application:
    name: card-lifecycle
  
  datasource:
    url: jdbc:postgresql://localhost:5432/card_management_db
    username: card_user
    password: card_pass
    driver-class-name: org.postgresql.Driver
    
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: false

  # Kafka: solo se leen bootstrap-servers y group-id. El consumidor lo arma KafkaConsumerConfig
  # (StringDeserializer + conversión a mano, auto-offset-reset earliest, ack MANUAL, reintentos y DLQ):
  # no agregar acá deserializers ni propiedades spring.json.*, porque no se aplican
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: card-lifecycle-consumer-group

# Reintentos del consumidor antes de enviar un mensaje a dlq.card-events (1 s, 2 s, 4 s, 8 s)
card-lifecycle:
  kafka:
    retry:
      max-retries: 4
      initial-interval-ms: 1000
    # Reproceso automático de dlq.card-events (DeadLetterRedriver): reinyecta cada mensaje en su topic
    # después de 1, 2, 4, 8 y 16 min desde que entró a la DLQ (~31 min en total); los ilegibles y los que
    # agotan los intentos quedan en la DLQ para revisión manual
    # Historial de cambios de estado (CardStatusEventConsumer, grupo <group-id>-history). La primera vez
    # arranca desde el final de los topics: los cambios anteriores ya están en state_transitions
    history:
      auto-offset-reset: latest
    dlq-redrive:
      enabled: true
      max-attempts: 5
      initial-delay-ms: 60000
      multiplier: 2
      send-timeout-ms: 10000
      retry-interval-ms: 5000

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.unisono.card: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: INFO
