spring:
  application:
    name: card-lifecycle
  
  datasource:
    url: jdbc:postgresql://localhost:5432/card_management_db
    username: card_user
    password: card_pass
    driver-class-name: org.postgresql.Driver
    
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: false

  # Kafka: solo se leen bootstrap-servers y group-id. El consumidor lo arma KafkaConsumerConfig
  # (StringDeserializer + conversión a mano, auto-offset-reset earliest, ack MANUAL, reintentos y DLQ):
  # no agregar acá deserializers ni propiedades spring.json.*, porque no se aplican
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: card-lifecycle-consumer-group

# Reintentos del consumidor antes de enviar un mensaje a dlq.card-events (1 s, 2 s, 4 s, 8 s)
card-lifecycle:
  kafka:
    retry:
      max-retries: 4
      initial-interval-ms: 1000

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.unisono.card: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: INFO
