spring:
  application:
    name: card-lifecycle
  
  datasource:
    url: jdbc:postgresql://localhost:5432/card_management_db
    username: card_user
    password: card_pass
    driver-class-name: org.postgresql.Driver
    
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: false

  # ✅ CONFIGURACIÓN DE KAFKA CONSUMER
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: card-lifecycle-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.unisono.card.events.domain"
        spring.json.value.default.type: "com.unisono.card.events.domain.CardCreatedEvent"
    listener:
      ack-mode: manual

server:
  port: 8083

encryption:
  # Variable ENCRYPTION_KEY (docker-compose). ⚠️ Definirla en producción: exactamente 32 caracteres
  secret-key: "${ENCRYPTION_KEY:SecretKey32CharsForEncryption!!!}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.unisono.card: DEBUG
    org.springframework.kafka: INFO
    org.apache.kafka: INFO
