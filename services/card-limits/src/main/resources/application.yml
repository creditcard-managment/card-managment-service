spring:
  application:
    name: card-limits
  
  datasource:
    url: jdbc:postgresql://localhost:5432/card_management_db
    username: card_user
    password: card_pass
    driver-class-name: org.postgresql.Driver
    
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: false

  # Kafka: solo el productor del outbox (KafkaProducerConfig); card-limits no consume
  kafka:
    bootstrap-servers: localhost:9092

# Outbox de eventos credit-limit.* (CreditLimitOutboxRelay / CreditLimitOutboxCleaner)
card:
  limits:
    outbox:
      poll-interval-ms: 1000     # Frecuencia de lectura de eventos pendientes
      batch-size: 50             # Eventos por pasada
      send-timeout-ms: 15000     # Espera por evento; debe superar delivery.timeout.ms + max.block.ms del productor
      retention-days: 7          # Días que se conservan los eventos publicados
      cleanup-cron: "0 0 3 * * *" # Limpieza diaria (los eventos fallidos no se borran)

server:
  port: 8082  # ✅ Puerto diferente

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.unisono.card: DEBUG
