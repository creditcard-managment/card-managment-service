spring:
  application:
    name: card-limits
  
  datasource:
    url: jdbc:postgresql://localhost:5432/card_management_db
    username: card_user
    password: card_pass
    driver-class-name: org.postgresql.Driver
    
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: false

server:
  port: 8082  # ✅ Puerto diferente

encryption:
  secret-key: "MySecretKey32BytesForAES256!!123" # ⚠️ CAMBIAR EN PRODUCCIÓN (exactamente 32 caracteres)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.unisono.card: DEBUG
