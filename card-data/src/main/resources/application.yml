spring:
  application:
    name: card-data
  
  datasource:
    url: jdbc:postgresql://localhost:5432/card_management_db
    username: card_user
    password: card_pass
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: CardManagementHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

server:
  port: 8081

encryption:
  secret-key: "MySecretKey32BytesForAES256!!123" # ⚠️ CAMBIAR EN PRODUCCIÓN (exactamente 32 caracteres)

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics  # Exponer endpoints específicos
        # O exponer todos: include: "*"
  endpoint:
    health:
      show-details: always  # Mostrar detalles del health check

logging:
  level:
    com.unisono.card: DEBUG
    org.hibernate.SQL: DEBUG
