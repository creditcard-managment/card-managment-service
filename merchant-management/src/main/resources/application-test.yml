# Test Profile Configuration
spring:
  profiles:
    active: test

  # Test Database Configuration (H2 in-memory)
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5

  # JPA Configuration for Tests
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

  # Flyway disabled for tests
  flyway:
    enabled: false

  # Kafka Embedded for tests
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

  # Security disabled for tests
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999
          jwk-set-uri: http://localhost:9999/.well-known/jwks.json

# Logging for tests
logging:
  level:
    root: WARN
    com.unisono.card.merchant: DEBUG
    org.springframework: WARN
