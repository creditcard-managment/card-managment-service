version: '3.8'

services:
  # =============================================
  # PostgreSQL Database
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: card-management-postgres
    environment:
      POSTGRES_DB: card_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - card-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # pgAdmin (opcional - para administración)
  # =============================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: card-management-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@unisono.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    networks:
      - card-network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  card-network:
    driver: bridge
